name: CI Autopilot Fixer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ci-autopilot]

permissions:
  contents: read
  issues: read

jobs:
  fixer:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Python diagnostics
        run: |
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } elseif (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 --version
          } else {
            throw "Python not found in PATH."
          }

      - name: Create venv
        run: |
          $py = Get-Command python -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -m venv .venv
            return
          }
          $pyLauncher = Get-Command py -ErrorAction SilentlyContinue
          if ($pyLauncher) {
            & $pyLauncher.Source -3 -m venv .venv
            return
          }
          throw "Python not found for venv creation."

      - name: Install dependencies
        run: .\.venv\Scripts\python -m pip install -r requirements.txt

      - name: Prepare logs directory
        run: New-Item -ItemType Directory -Force logs | Out-Null

      - name: Run CI Autopilot
        run: |
          .\.venv\Scripts\python -m agent.poll_once 2>&1 | Tee-Object -FilePath logs\run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-autopilot-logs
          path: logs\run.log
