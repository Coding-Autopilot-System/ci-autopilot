name: CI Autopilot Fixer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ci-autopilot]

permissions:
  contents: read
  issues: read

jobs:
  fixer:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: .\.venv\Scripts\python -m pip install -r requirements.txt

      - name: Prepare logs directory
        run: New-Item -ItemType Directory -Force logs | Out-Null

      - name: Run CI Autopilot
        run: |
          .\.venv\Scripts\python -m agent.poll_once 2>&1 | Tee-Object -FilePath logs\run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-autopilot-logs
          path: logs\run.log
